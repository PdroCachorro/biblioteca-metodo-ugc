name: Update ranking

on:
  schedule:
    # 21:00 UTC = 18:00 America/Sao_Paulo (Brazil has had no DST since 2019)
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scraper deps + Chromium
        working-directory: scraper
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Scrape FastMoss top-5 rankings
        working-directory: scraper
        run: node scrape.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild index.html
        run: python build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ranking_data.json images/products index.html
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza ranking TikTok Shop ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, retrying with rebase ($i/5)..."
            git pull --rebase origin master
          done
          git push

